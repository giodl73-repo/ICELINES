[workspace]
resolver = "2"
members = [
    "icelines-core",
    "icelines-query",
    "icelines-fetch",
    "icelines-site",
    "icelines-web",
    "icelines-cli",
]

[workspace.package]
version     = "0.25.0"
edition     = "2021"
authors     = ["IceLines Contributors"]
license     = "MIT"
repository  = "https://github.com/giodl73-repo/ICELINES"

[workspace.dependencies]
# Shared across crates — pin versions here, reference with { workspace = true }
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clap        = { version = "4", features = ["derive", "env"] }
anyhow      = "1"
csv         = "1"
encoding_rs = "0.8"
comfy-table = "7"
owo-colors  = "4"
rusqlite    = { version = "0.31", features = ["bundled"] }
flate2      = "1"
tar         = "0.4"
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
toml        = "0.8"
tera        = "1"
sha2        = "0.10"
regex       = "1"
once_cell   = "1"
ratatui     = "0.29"
crossterm   = { version = "0.28", features = ["event-stream"] }
httpmock    = "0.7"
proptest    = "1"
static_assertions = "1"
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile    = "3"
axum        = { version = "0.7", features = ["json"] }
tower       = { version = "0.4", features = ["util"] }
tower-http  = { version = "0.5", features = ["compression-gzip", "cors", "trace", "fs"] }
ulid        = "1"
askama      = "0.12"
open        = "5"
pulldown-cmark = "0.10"
fletch-core = { path = "../FLETCH/crates/fletch-core" }
