name: CI

on:
  push:
    branches: [master]
    paths:
      - 'icelines-*/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'icelines-*/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('icelines-*/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: L0 — Unit tests (icelines-core)
        run: cargo test -p icelines-core --lib

      - name: L1 — Integration tests (icelines-fetch)
        run: cargo test -p icelines-fetch

      - name: All tests
        run: cargo test

      - name: Clippy (zero warnings)
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release -p icelines-cli

      - name: L2 — System tests
        run: cargo test -p icelines-cli --test system_tests

  coverage:
    name: Coverage Gate (icelines-core ≥ 80%)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cov-${{ hashFiles('Cargo.lock') }}

      - name: Check icelines-core coverage ≥ 80%
        run: cargo llvm-cov -p icelines-core --lib --fail-under-lines 80
