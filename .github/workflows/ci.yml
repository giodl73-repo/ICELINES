name: CI

on:
  push:
    branches: [master]
    paths:
      - 'icelines-*/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/data-bundle.yml'
      - 'scripts/test-slice.ps1'
      - 'scripts/release-smoke.ps1'
      - 'scripts/package-release.ps1'
      - 'scripts/verify-release-artifact.ps1'
      - 'scripts/ferris-artifact.py'
      - 'scripts/window-browser-review.ps1'
      - 'design/release-checklist.md'
      - 'design/data/**'
      - 'design/schemas/**'
      - 'design/current-season-rollover.md'
      - 'design/plans/**'
      - 'design/waves/**'
      - 'design/phases.md'
      - 'design/ARCHITECTURE.md'
      - 'design/specs/**'
      - 'design/specs/data-bundles.md'
      - 'docs/guides/04-data.md'
      - 'docs/organization-window.md'
      - 'examples/**'
      - 'src/guides/04-data.source.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'COMMANDS.md'
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FERRIS_REPOSITORY: giodl73-repo/FERRIS
  FERRIS_REVISION: 73ee870fd7e7689637a93bfb835fcbf8d1ccda4e
  # The generated Clap graph exceeds Rust's default Windows test-thread stack.
  RUST_MIN_STACK: 16777216

jobs:
  quality:
    name: Quality / ${{ matrix.area }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: fmt
            command: cargo fmt --check
          - area: clippy
            command: cargo clippy -- -D warnings
          - area: audit
            command: powershell -ExecutionPolicy Bypass -File scripts/test-slice.ps1 ci-audit

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('icelines-*/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        if: matrix.area == 'audit'
        uses: taiki-e/install-action@cargo-audit

      - name: Run ${{ matrix.area }}
        run: ${{ matrix.command }}

  tests:
    name: Tests / ${{ matrix.area }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: core-lib
            command: cargo test -p icelines-core --lib
          - area: core-integration
            command: cargo test -p icelines-core --tests
          - area: query
            command: cargo test -p icelines-query
          - area: fetch
            command: cargo test -p icelines-fetch
          - area: web
            command: cargo test -p icelines-web
          - area: site
            command: cargo test -p icelines-site
          - area: cli-lib
            command: cargo test -p icelines-cli --lib
          - area: cli-tui-bin
            command: cargo test -p icelines-cli --bin icelines
          - area: cli-art-ross
            command: cargo test -p icelines-cli --test art_ross_a0_parity --test art_ross_a2_executor --test art_ross_a5_explain --test art_ross_w14_semantic --test art_ross_w14b_goalies --test art_ross_w15_trades --test art_ross_w23_tui_filter --test art_ross_w25_career_filter
          - area: cli-lindsay
            command: cargo test -p icelines-cli --test lindsay_l3_golden --test lindsay_l5_subprocess
          - area: cli-persona
            command: cargo test -p icelines-cli --test persona_foster --test persona_masterton_standalone --test persona_scenarios --test persona_wave2 --test persona_wave3 --test persona_wave4 --test persona_wave5 --test persona_wave6 --test persona_wave7 --test persona_wave9 --test persona_wave10 --test persona_wave11 --test persona_wave16 --test persona_wave18 --test persona_wave20 --test persona_wave23 --test persona_wave25
          - area: cli-system
            command: cargo test -p icelines-cli --test system_tests --test system_tui_experiences
          - area: cli-smoke
            command: cargo test -p icelines-cli --test foster_capability_matrix
          - area: doc-tests
            command: cargo test --workspace --doc

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('icelines-*/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Run ${{ matrix.area }}
        run: ${{ matrix.command }}

  release:
    name: Build / release CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('icelines-*/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Run release smoke
        run: powershell -ExecutionPolicy Bypass -File scripts/release-smoke.ps1

  window-fingerprint:
    name: Window fingerprint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-window-fingerprint-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('icelines-core/src/view_model/organization_window.rs', 'examples/organization-window-board-evaluation-2026-27.json') }}
          restore-keys: |
            ${{ runner.os }}-window-fingerprint-${{ hashFiles('Cargo.lock') }}-

      - name: Verify canonical Window fingerprint and replay
        run: cargo test -p icelines-core canonical_window_fingerprint_is_cross_platform_and_replay_valid --lib --locked

  package-matrix:
    name: Package / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: icelines-linux-x86_64
            archive: icelines-linux-x86_64.tar.gz
            platform: linux
            binary: icelines
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: icelines-macos-x86_64
            archive: icelines-macos-x86_64.tar.gz
            platform: macos
            binary: icelines
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: icelines-windows-x86_64
            archive: icelines-windows-x86_64.zip
            platform: windows
            binary: icelines.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-package-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p icelines-cli

      - name: Package and verify release shape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          archive_name="${{ matrix.archive }}"
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/icelines \1/')"
          binary_sha256="$(sha256sum "dist/${{ matrix.binary }}" | awk '{print $1}')"
          {
            echo "artifact=${archive_name}"
            echo "binary=${{ matrix.binary }}"
            echo "version=${version}"
            echo "source_commit=${{ github.sha }}"
            echo "binary_sha256=${binary_sha256}"
          } > dist/ICELINES-PACKAGE.txt
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${archive_name}" ./dist/*
            sha256sum "${archive_name}" > "${archive_name}.sha256"
            sha256sum -c "${archive_name}.sha256"
            7z l "${archive_name}" | grep -F "${{ matrix.binary }}"
            7z l "${archive_name}" | grep -F "ICELINES-PACKAGE.txt"
          else
            tar czf "${archive_name}" -C dist .
            sha256sum "${archive_name}" > "${archive_name}.sha256"
            sha256sum -c "${archive_name}.sha256"
            tar tzf "${archive_name}" | grep -F "./${{ matrix.binary }}"
            tar tzf "${archive_name}" | grep -F "./ICELINES-PACKAGE.txt"
          fi
          cp dist/ICELINES-PACKAGE.txt "${archive_name}.manifest.txt"

      - name: Record Ferris producer envelope
        run: >
          python scripts/ferris-artifact.py produce
          --artifact "${{ matrix.archive }}"
          --manifest "${{ matrix.archive }}.manifest.txt"
          --artifact-id "${{ matrix.artifact }}"
          --target "${{ matrix.target }}"
          --platform-os "${{ matrix.platform }}"
          --platform-architecture x86_64
          --source-revision "${{ github.sha }}"
          --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"
          --output "${{ matrix.archive }}.ferris-producer.json"

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ matrix.archive }}.manifest.txt
            ${{ matrix.archive }}.ferris-producer.json
          retention-days: 1

  ferris-artifact-consumer:
    name: Ferris artifact / ${{ matrix.target }}
    needs: package-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: icelines-linux-x86_64
            archive: icelines-linux-x86_64.tar.gz
            platform: linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: icelines-macos-x86_64
            archive: icelines-macos-x86_64.tar.gz
            platform: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: icelines-windows-x86_64
            archive: icelines-windows-x86_64.zip
            platform: windows

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check out exact Ferris revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.FERRIS_REPOSITORY }}
          ref: ${{ env.FERRIS_REVISION }}
          path: _ferris-source
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            crates
          sparse-checkout-cone-mode: false

      - name: Build exact Ferris revision
        run: cargo build --locked --release --manifest-path _ferris-source/Cargo.toml -p ferris-cli --bin ferris

      - name: Download owner package
        uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: artifact-input

      - name: Qualify downloaded artifact with Ferris
        run: >
          python scripts/ferris-artifact.py consume
          --artifact "artifact-input/${{ matrix.archive }}"
          --manifest "artifact-input/${{ matrix.archive }}.manifest.txt"
          --producer "artifact-input/${{ matrix.archive }}.ferris-producer.json"
          --ferris "_ferris-source/target/release/ferris${{ runner.os == 'Windows' && '.exe' || '' }}"
          --target "${{ matrix.target }}"
          --platform-os "${{ matrix.platform }}"
          --platform-architecture x86_64
          --source-revision "${{ github.sha }}"
          --consumer-id "package-integrity-${{ matrix.platform }}"
          --consumer-id "package-smoke-${{ matrix.platform }}"
          --request-output "artifact-evidence/${{ matrix.platform }}-request.json"
          --report-output "artifact-evidence/${{ matrix.platform }}-report.json"

      - name: Verify and smoke downloaded owner package
        shell: pwsh
        run: >
          ./scripts/verify-release-artifact.ps1
          -ArtifactPath "artifact-input/${{ matrix.archive }}"
          -ManifestPath "artifact-input/${{ matrix.archive }}.manifest.txt"
          -ExpectedSourceRevision "${{ github.sha }}"
          -Smoke

      - name: Upload Ferris artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferris-artifact-evidence-${{ matrix.artifact }}
          path: artifact-evidence/*.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage Gate (icelines-core >= 80%)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cov-${{ hashFiles('Cargo.lock') }}

      - name: Check icelines-core coverage >= 80%
        run: cargo llvm-cov -p icelines-core --lib --fail-under-lines 80
