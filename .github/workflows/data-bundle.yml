name: Data Bundle

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to bundle (space-separated YYYYZZZZ) — leave blank for all 25'
        required: false
        default: ''
  schedule:
    # Refresh current season weekly on Monday mornings
    - cron: '0 6 * * 1'

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  bundle:
    name: Bundle ${{ matrix.season }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        season:
          # ── Current 5 seasons (bundled in binary) ──────────────────────────
          - '20252026'
          - '20242025'
          - '20232024'
          - '20222023'
          - '20212022'
          # ── Historical seasons 2000-01 → 2020-21 ──────────────────────────
          - '20202021'
          - '20192020'
          - '20182019'
          - '20172018'
          - '20162017'
          - '20152016'
          - '20142015'
          - '20132014'
          - '20122013'
          - '20112012'
          - '20102011'
          - '20092010'
          - '20082009'
          - '20072008'
          - '20062007'
          - '20052006'
          - '20032004'
          - '20022003'
          - '20012002'
          - '20002001'
          # ── Gretzky-trade era 1987-88 → 1999-2000 ─────────────────────────
          - '19992000'
          - '19981999'
          - '19971998'
          - '19961997'
          - '19951996'
          - '19941995'
          - '19931994'
          - '19921993'
          - '19911992'
          - '19901991'
          - '19891990'
          - '19881989'
          - '19871988'

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for current season refresh)
        if: matrix.season == '20252026'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Refresh current season data from NHL API
        if: matrix.season == '20252026'
        working-directory: .
        run: |
          python3 scripts/fetch_history.py --seasons 20252026 --force

      - name: Check data exists for this season
        id: check
        working-directory: .
        run: |
          DATA_DIR="data/seasons/${{ matrix.season }}"
          if [ -f "${DATA_DIR}/bios.json" ] && [ -f "${DATA_DIR}/stats.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # Phase G.0: goalie-stats.json shipped from 2026-04-29 onwards.
            # Older release artifacts (rebuilt before this date) lack the
            # file; the workflow includes it when present so re-publication
            # is the final step that adds it to the tarball.
            if [ -f "${DATA_DIR}/goalie-stats.json" ]; then
              echo "has_goalies=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_goalies=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No data for ${{ matrix.season }} — skipping"
          fi

      - name: Pack season bundle
        if: steps.check.outputs.exists == 'true'
        working-directory: .
        run: |
          SEASON="${{ matrix.season }}"
          BUNDLE="data-${SEASON}.tar.gz"
          DATA_DIR="data/seasons/${SEASON}"

          mkdir -p "/tmp/bundle-${SEASON}"
          cp "${DATA_DIR}/bios.json"  "/tmp/bundle-${SEASON}/bios.json"
          cp "${DATA_DIR}/stats.json" "/tmp/bundle-${SEASON}/stats.json"

          # Phase G.0: goalie-stats.json ships in every tarball from this
          # workflow run forward. Older releases that pre-date this commit
          # lack the file; consumers are expected to re-install via
          # `icelines data install --season {S} --force` to pick it up.
          GOALIES_COUNT=0
          if [ -f "${DATA_DIR}/goalie-stats.json" ]; then
            cp "${DATA_DIR}/goalie-stats.json" "/tmp/bundle-${SEASON}/goalie-stats.json"
            GOALIES_COUNT=$(python3 -c "import json; print(len(json.load(open('${DATA_DIR}/goalie-stats.json'))))" 2>/dev/null || echo 0)
          fi

          # Hart.6.3 — playoff trio ships in every tarball from this commit
          # forward. Files are present on every bundled season as of
          # 2026-05-02 (authored via `icelines fetch ... --type playoff`).
          # The 2025-26 file is `[]` until the Cup is contested; bundling
          # it anyway keeps the pipeline schema stable.
          PLAYOFF_BIOS_COUNT=0
          PLAYOFF_GOALIES_COUNT=0
          if [ -f "${DATA_DIR}/playoff-bios.json" ]; then
            cp "${DATA_DIR}/playoff-bios.json"         "/tmp/bundle-${SEASON}/playoff-bios.json"
            cp "${DATA_DIR}/playoff-stats.json"        "/tmp/bundle-${SEASON}/playoff-stats.json"
            cp "${DATA_DIR}/playoff-goalie-stats.json" "/tmp/bundle-${SEASON}/playoff-goalie-stats.json"
            PLAYOFF_BIOS_COUNT=$(python3 -c "import json; print(len(json.load(open('${DATA_DIR}/playoff-bios.json'))))" 2>/dev/null || echo 0)
            PLAYOFF_GOALIES_COUNT=$(python3 -c "import json; print(len(json.load(open('${DATA_DIR}/playoff-goalie-stats.json'))))" 2>/dev/null || echo 0)
          fi

          # Metadata — extended with goalies + playoff counts.
          BIOS_COUNT=$(python3 -c "import json; print(len(json.load(open('${DATA_DIR}/bios.json'))))" 2>/dev/null || echo 0)
          echo "{\"season\":\"${SEASON}\",\"bundled_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"bios_count\":${BIOS_COUNT},\"goalies_count\":${GOALIES_COUNT},\"playoff_bios_count\":${PLAYOFF_BIOS_COUNT},\"playoff_goalies_count\":${PLAYOFF_GOALIES_COUNT}}" \
            > "/tmp/bundle-${SEASON}/manifest.json"

          cd /tmp && tar czf "${BUNDLE}" "bundle-${SEASON}/"

          SIZE=$(stat -c%s "${BUNDLE}")
          echo "Bundle ${SEASON}: ${SIZE} bytes compressed (${BIOS_COUNT} skaters, ${GOALIES_COUNT} goalies, ${PLAYOFF_BIOS_COUNT} playoff skaters, ${PLAYOFF_GOALIES_COUNT} playoff goalies)"

          mv "${BUNDLE}" "$GITHUB_WORKSPACE/"

      - name: Create or update data release
        if: steps.check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ matrix.season }}
          name: NHL Data — ${{ matrix.season }}
          body: |
            Pre-packaged NHL season data for **${{ matrix.season }}**.

            ## Install

            ```bash
            icelines data install --season ${{ matrix.season }}
            ```

            ## Bulk install (last N seasons)

            ```bash
            icelines data install --seasons 25   # all historical
            icelines data install --seasons 5    # recent only
            ```

            ## Contents

            | File | Description |
            |------|-------------|
            | `bios.json` | Skater biographical data (nationality, draft, age) |
            | `stats.json` | Skater season statistics (G, A, GP, PP, SH, GWG, shots, TOI) |
            | `goalie-stats.json` | Goalie season statistics (W, L, SV%, GAA, SO, saves, TOI) — added 2026-04-29 |
            | `playoff-bios.json` | Playoff-roster bios for the season — added 2026-05-02 (Hart.6) |
            | `playoff-stats.json` | Per-player playoff stats (G, A, GP, PP, SH, GWG, shots) |
            | `playoff-goalie-stats.json` | Playoff goalie stats (W, L, SV%, GAA, SO) |
            | `manifest.json` | Bundle metadata: regular + playoff counts |

            Data sourced from the NHL public API. Historical seasons are immutable.

            **Note**: bundles created before 2026-05-02 do not include
            the `playoff-*.json` trio. Re-install with `icelines data
            install --season {SEASON} --force` to pick up the new files.
            Bundles before 2026-04-29 also lack `goalie-stats.json`.
          files: data-${{ matrix.season }}.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
