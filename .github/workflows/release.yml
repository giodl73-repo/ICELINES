name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: icelines-linux-x86_64
            binary: icelines

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: icelines-macos-x86_64
            binary: icelines

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: icelines-windows-x86_64
            binary: icelines.exe

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p icelines-cli

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive_name="${{ matrix.artifact }}.zip"
          else
            archive_name="${{ matrix.artifact }}.tar.gz"
          fi
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/icelines \1/')"
          binary_sha256="$(sha256sum "dist/${{ matrix.binary }}" | awk '{print $1}')"
          {
            echo "artifact=${archive_name}"
            echo "binary=${{ matrix.binary }}"
            echo "version=${version}"
            echo "source_commit=${{ github.sha }}"
            echo "binary_sha256=${binary_sha256}"
            echo "built_at_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > dist/ICELINES-PACKAGE.txt
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${archive_name}" .
            cd ..
            sha256sum "${archive_name}" > "${archive_name}.sha256"
          else
            tar czf "../${archive_name}" .
            cd ..
            sha256sum "${archive_name}" > "${archive_name}.sha256"
          fi

      - name: Verify packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f "${{ matrix.artifact }}.zip"
            test -f "${{ matrix.artifact }}.zip.sha256"
            sha256sum -c "${{ matrix.artifact }}.zip.sha256"
            7z l "${{ matrix.artifact }}.zip" | grep -F "${{ matrix.binary }}"
            7z l "${{ matrix.artifact }}.zip" | grep -F "ICELINES-PACKAGE.txt"
          else
            test -f "${{ matrix.artifact }}.tar.gz"
            test -f "${{ matrix.artifact }}.tar.gz.sha256"
            sha256sum -c "${{ matrix.artifact }}.tar.gz.sha256"
            tar tzf "${{ matrix.artifact }}.tar.gz" | grep -F "${{ matrix.binary }}"
            tar tzf "${{ matrix.artifact }}.tar.gz" | grep -F "ICELINES-PACKAGE.txt"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: IceLines ${{ github.ref_name }}
          body: |
            ## IceLines ${{ github.ref_name }}

            NHL depth chart tracker and analytics CLI.

            ### Install

            Download the binary for your platform, extract, and add to your PATH.
            SHA-256 sidecars are published next to each archive for artifact verification.

            ### Quick start

            ```bash
            icelines fetch all          # fetch NHL data
            icelines rank --top 20      # top 20 players by PPG pace
            icelines team SEA           # Seattle Kraken lineup
            icelines                    # launch TUI
            ```

            See [README](https://github.com/giodl73-repo/ICELINES#readme) for full usage.
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
