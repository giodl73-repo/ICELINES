name: Browser WASM / Pages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed build for validation or accepted release (master only; deployment approval required)'
        type: boolean
        default: false
      sparse_storage:
        description: 'Validate the opt-in sparse backend and retain a preview; cannot publish'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browser-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reject publication of the experimental sparse backend
        if: inputs.sparse_storage && inputs.publish
        run: |
          echo 'Sparse storage is validation-only; publish must be false.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Read pinned browser toolchain
        id: toolchain
        run: |
          python - <<'PY'
          import json, os
          with open('icelines-browser/toolchain.json', encoding='utf-8') as source:
              versions = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name in ('rust', 'node', 'python'):
                  output.write(f'{name}={versions[name]}\n')
          PY
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: icelines-browser/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - name: Install locked browser dependencies
        working-directory: icelines-browser
        run: npm ci --ignore-scripts
      - name: Test NHL relay
        run: node --test icelines-relay/worker.test.mjs
      - name: Build and verify browser distribution
        env:
          SPARSE_STORAGE: ${{ inputs.sparse_storage || false }}
        run: |
          if [ "$SPARSE_STORAGE" = true ]; then
            node scripts/build-browser.mjs --check --sparse-storage
          else
            node scripts/build-browser.mjs --check
          fi
      - name: Retain reviewed preview / rollback artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icelines-browser${{ inputs.sparse_storage && '-sparse' || '' }}-${{ github.sha }}
          path: icelines-browser/dist
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Read existing Pages site
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: target/pages-baseline
          persist-credentials: false
      - name: Preserve existing site and stage workbench
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        run: python scripts/stage-browser-pages.py target/pages-baseline icelines-browser/dist target/pages-site > target/pages-preservation.json
      - name: Upload composed Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages-site
          include-hidden-files: true
      - name: Verify composed Pages archive before deployment
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        run: python scripts/verify-browser-pages-archive.py target/pages-site "$RUNNER_TEMP/artifact.tar"
      - name: Retain publication preservation evidence
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-preservation-${{ github.sha }}
          path: target/pages-preservation.json
          retention-days: 30
          if-no-files-found: error
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
