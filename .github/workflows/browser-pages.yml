name: Browser WASM / Pages
on:
  pull_request:
    paths: ['icelines-core/**', 'icelines-data/**', 'icelines-query/**', 'icelines-sources/**', 'icelines-fetch/**', 'icelines-wasm/**', 'icelines-browser/**', 'icelines-relay/**', 'data/seasons/**', 'Cargo.toml', 'Cargo.lock', 'scripts/*browser*', 'scripts/tests/test_browser*.py', '.github/workflows/browser*.yml']
  push:
    branches: [master]
    paths: ['icelines-core/**', 'icelines-data/**', 'icelines-query/**', 'icelines-sources/**', 'icelines-fetch/**', 'icelines-wasm/**', 'icelines-browser/**', 'icelines-relay/**', 'data/seasons/**', 'Cargo.toml', 'Cargo.lock', 'scripts/*browser*', 'scripts/tests/test_browser*.py', '.github/workflows/browser*.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed build for validation or accepted release (master only; deployment approval required)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browser-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Read pinned browser toolchain
        id: toolchain
        run: |
          python - <<'PY'
          import json, os
          with open('icelines-browser/toolchain.json', encoding='utf-8') as source:
              versions = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name in ('rust', 'node', 'python'):
                  output.write(f'{name}={versions[name]}\n')
          PY
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: icelines-browser/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - name: Install locked browser dependencies
        working-directory: icelines-browser
        run: npm ci --ignore-scripts
      - name: Test NHL relay
        run: node --test icelines-relay/worker.test.mjs
      - name: Build and verify browser distribution
        run: node scripts/build-browser.mjs --check
      - name: Retain reviewed preview / rollback artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icelines-browser-${{ github.sha }}
          path: icelines-browser/dist
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Read existing Pages site
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: target/pages-baseline
          persist-credentials: false
      - name: Preserve existing site and stage workbench
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        run: python scripts/stage-browser-pages.py target/pages-baseline icelines-browser/dist target/pages-site > target/pages-preservation.json
      - name: Upload composed Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages-site
      - name: Retain publication preservation evidence
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-preservation-${{ github.sha }}
          path: target/pages-preservation.json
          retention-days: 30
          if-no-files-found: error
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
