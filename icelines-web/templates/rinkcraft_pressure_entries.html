<div class="rk-pressure-list"><small>Observed responses</small>{% for entry in pressure.entries %}<details class="rk-pressure-entry" data-challenge-id="{{ entry.id }}"><summary><strong>{{ entry.name }}</strong><span>{{ entry.result }}</span></summary><p>{{ entry.challenge }} → {{ entry.response }}</p><p>{{ entry.definition }}</p><small>{{ entry.source }} · {{ entry.coverage }} · captured {{ "{:.10}"|format(entry.captured_at) }}</small><p>{{ entry.note }}</p></details>{% endfor %}</div>
