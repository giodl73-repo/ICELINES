<section class="rk-passing-record"><h3>Passing record</h3><p>{{ passing_record.season / 10000 }}–{{ "{:02}"|format(passing_record.season % 100) }} · {{ passing_record.games }} GP · all strengths · NHL</p><dl>{% for row in passing_record.rows %}<div><dt>{{ row.label }}</dt><dd>{{ row.value }}</dd></div>{% endfor %}</dl><p>{{ passing_record.formula }}</p><p>{{ passing_record.note }}</p></section>
