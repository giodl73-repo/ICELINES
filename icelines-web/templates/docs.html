{% extends "base.html" %}

{% block title %}Docs{% endblock %}

{% block content %}
<p style="margin-bottom: 0.5rem;">
    <a href="/">← back to dashboard</a>
</p>

<style>
    /* Scoped tweaks for the rendered markdown — keep this minimal,
       lean on the base stylesheet for everything else. */
    .markdown-body { max-width: 920px; }
    .markdown-body h1 { margin-top: 0; }
    .markdown-body h2 { margin-top: 2rem; border-bottom: 1px solid #e0e0e0; padding-bottom: 0.25rem; }
    .markdown-body h3 { margin-top: 1.5rem; }
    .markdown-body pre {
        background: #f0f0f0; padding: 0.75rem 1rem; border-radius: 4px;
        overflow-x: auto; font-size: 0.85rem; line-height: 1.4;
    }
    .markdown-body code {
        background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 2px;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 0.9em;
    }
    .markdown-body pre code { background: none; padding: 0; }
    .markdown-body table { margin: 0.75rem 0; }
    .markdown-body blockquote {
        border-left: 4px solid #1565c0; padding-left: 1rem;
        color: #616161; margin: 0.75rem 0;
    }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5rem; }
</style>

<div class="markdown-body">
    {{ rendered_html|safe }}
</div>
{% endblock %}
