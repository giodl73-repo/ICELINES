<div class="rk-skating-summary"><strong>{{ skating.headline }}</strong><small>{{ skating.secondary }}</small><small>Recorded · all strengths</small><details class="rk-skating-measures"><summary>Measures &amp; scope</summary>{% for row in skating.rows %}<div data-skating-metric="{{ row.key }}"><b>{{ row.label }}</b><span>{{ row.value }}</span>{% match row.comparison %}{% when Some with (comparison) %}<small>{{ comparison }}</small>{% when None %}{% endmatch %}</div>{% endfor %}<p>{{ skating.note }}</p></details></div>
