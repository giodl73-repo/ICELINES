<section class="rk-reading-record"><h3>Reading record</h3><p>{{ reading_record.season / 10000 }}–{{ "{:02}"|format(reading_record.season % 100) }} · {{ reading_record.games }} GP · all strengths · NHL</p><dl>{% for row in reading_record.rows %}<div><dt>{{ row.label }}</dt><dd>{{ row.value }}</dd></div>{% endfor %}</dl><p>{{ reading_record.formula }}</p><p>{{ reading_record.note }}</p></section>
