<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IceLines logo">
  <title>IceLines</title>
  <!-- Hockey-themed mark: a stylized line of three concentric rings
