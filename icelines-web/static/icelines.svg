  <circle cx="32" cy="32" r="18" fill="none" stroke="#1565c0" stroke-width="2.5" opacity="0.7"/>
  <circle cx="32" cy="32" r="8"  fill="#1565c0"/>
  <text x="32" y="60" text-anchor="middle" font-family="system-ui, sans-serif"
        font-weight="700" font-size="8" fill="#1565c0">ICELINES</text>
</svg>
