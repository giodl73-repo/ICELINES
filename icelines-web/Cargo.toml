[package]
name = "icelines-web"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# `send-sync` drops the !Send + !Sync soft-lint on StatsRepository so
# we can hold `Arc<RwLock<StatsRepository>>` in axum's State<_>. King.1.2.
icelines-core = { path = "../icelines-core", features = ["send-sync"] }
icelines-fetch = { path = "../icelines-fetch" }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
anyhow = { workspace = true }
askama = { workspace = true }
pulldown-cmark = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }
