site_name: IceLines
site_description: NHL depth charts, pace-adjusted rankings, and trade analysis for all 32 teams
site_url: https://giodl73-repo.github.io/ICELINES/
repo_url: https://github.com/giodl73-repo/ICELINES
repo_name: IceLines
docs_dir: docs
site_dir: ../fantasy-site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - tables
  - attr_list
  - def_list
  - admonition
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - assets/fantasy.css

plugins:
  - search:
      lang: en

nav:
  - Tracker: index.md
  - Teams:
    - TBL — Tampa Bay Lightning: teams/TBL.md
    - MIN — Minnesota Wild: teams/MIN.md
    - BUF — Buffalo Sabres: teams/BUF.md
    - MTL — Montréal Canadiens: teams/MTL.md
    - COL — Colorado Avalanche: teams/COL.md
    - DAL — Dallas Stars: teams/DAL.md
    - VGK — Vegas Golden Knights: teams/VGK.md
    - ANA — Anaheim Ducks: teams/ANA.md
    - CAR — Carolina Hurricanes: teams/CAR.md
    - EDM — Edmonton Oilers: teams/EDM.md
    - PIT — Pittsburgh Penguins: teams/PIT.md
    - WSH — Washington Capitals: teams/WSH.md
    - UTA — Utah Hockey Club: teams/UTA.md
    - OTT — Ottawa Senators: teams/OTT.md
    - FLA — Florida Panthers: teams/FLA.md
    - SJS — San Jose Sharks: teams/SJS.md
    - DET — Detroit Red Wings: teams/DET.md
    - CBJ — Columbus Blue Jackets: teams/CBJ.md
    - STL — St. Louis Blues: teams/STL.md
    - NSH — Nashville Predators: teams/NSH.md
    - PHI — Philadelphia Flyers: teams/PHI.md
    - BOS — Boston Bruins: teams/BOS.md
    - NJD — New Jersey Devils: teams/NJD.md
    - NYR — New York Rangers: teams/NYR.md
    - LAK — Los Angeles Kings: teams/LAK.md
    - TOR — Toronto Maple Leafs: teams/TOR.md
    - NYI — New York Islanders: teams/NYI.md
