[package]
name    = "icelines-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "icelines"
path = "src/main.rs"

[dependencies]
icelines-core  = { path = "../icelines-core" }
icelines-fetch = { path = "../icelines-fetch" }
icelines-site  = { path = "../icelines-site" }
clap.workspace        = true
anyhow.workspace      = true
tokio.workspace       = true
comfy-table.workspace = true
owo-colors.workspace  = true
serde.workspace       = true
serde_json.workspace  = true
toml.workspace        = true
ratatui.workspace     = true
crossterm.workspace   = true
rusqlite.workspace    = true
reqwest.workspace     = true
flate2.workspace      = true
tar.workspace         = true
sha2.workspace        = true
image.workspace       = true
axum.workspace        = true
tower.workspace       = true
uuid.workspace        = true
chrono.workspace      = true

[dev-dependencies]
# proof_lib is parked as a dev-dep — the smoke test in
# `tests/proof_lib_smoke.rs` keeps the integration code paved in case
# we re-introduce proof for site dashboard generation later. The TUI
# panel renders sparklines natively (`tui::sparkline`) after we hit a
# dashboard-region directive composition bug
# (see design/proof-bug-report.md).
proof_lib = { package = "proof", git = "https://github.com/giodl73-repo/PROOF", rev = "9c5d456ef49cf8e1aeb516557d52ea0ddb79fd2c" }
tempfile.workspace = true
