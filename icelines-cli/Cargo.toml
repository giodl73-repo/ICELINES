[package]
name    = "icelines-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "icelines_cli"
path = "src/lib.rs"

[[bin]]
name = "icelines"
path = "src/main.rs"

[dependencies]
icelines-core  = { path = "../icelines-core" }
icelines-fetch = { path = "../icelines-fetch" }
icelines-query = { path = "../icelines-query" }
icelines-web   = { path = "../icelines-web" }
# icelines-site dropped 2026-05-04 alongside the mkdocs-frontend cut.
# The crate stays in the workspace (cargo test still exercises it)
# but icelines-cli no longer consumes its markdown-generation API.
clap.workspace        = true
anyhow.workspace      = true
thiserror.workspace   = true
tokio.workspace       = true
comfy-table.workspace = true
csv.workspace         = true
owo-colors.workspace  = true
serde.workspace       = true
serde_json.workspace  = true
toml.workspace        = true
ratatui.workspace     = true
crossterm.workspace   = true
rusqlite.workspace    = true
reqwest.workspace     = true
flate2.workspace      = true
tar.workspace         = true
sha2.workspace        = true
image.workspace       = true
axum.workspace        = true
tower.workspace       = true
uuid.workspace        = true
chrono.workspace      = true
chrono-tz.workspace   = true
open.workspace        = true
# Phase Adams.6 — AI fallback trait uses async-trait for the
# Send-clean dyn AiProvider type. async-trait is already a
# transitive dep via axum/reqwest; pinning here keeps the
# direct usage explicit.
async-trait           = "0.1"

# Post-LP review fix #4 — used only on Unix, only in main.rs to reset
# SIGPIPE to SIG_DFL so `| head` doesn't turn into a Rust panic. Tiny
# platform-shim crate; trivial to remove if we add a portable helper.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
regex.workspace = true
