[package]
name    = "icelines-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "icelines"
path = "src/main.rs"

[dependencies]
icelines-core  = { path = "../icelines-core" }
icelines-fetch = { path = "../icelines-fetch" }
icelines-site  = { path = "../icelines-site" }
clap.workspace        = true
anyhow.workspace      = true
tokio.workspace       = true
comfy-table.workspace = true
owo-colors.workspace  = true
serde.workspace       = true
serde_json.workspace  = true
toml.workspace        = true
ratatui.workspace     = true
crossterm.workspace   = true
rusqlite.workspace    = true
reqwest.workspace     = true
flate2.workspace      = true
tar.workspace         = true
sha2.workspace        = true
image.workspace       = true
axum.workspace        = true
tower.workspace       = true
uuid.workspace        = true
chrono.workspace      = true

[dev-dependencies]
# Smoke-test proof's library API per design/proof_lib.md. The PROOF crate
# is named `proof` (binary) with `[lib] name = "proof_lib"` (library), so
# we rename the dep here to keep the natural `use proof_lib::...` imports
# in test code. Local path while proof's API is pre-1.0 — pin by SHA via
# `git = ..., rev = ...` once stable.
proof_lib = { package = "proof", path = "../../proof" }
tempfile.workspace = true
