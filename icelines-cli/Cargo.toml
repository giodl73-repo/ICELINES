[package]
name    = "icelines-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "icelines_cli"
path = "src/lib.rs"

[[bin]]
name = "icelines"
path = "src/main.rs"

[dependencies]
icelines-core  = { path = "../icelines-core" }
icelines-fetch = { path = "../icelines-fetch" }
icelines-query = { path = "../icelines-query" }
icelines-web   = { path = "../icelines-web" }
# icelines-site dropped 2026-05-04 alongside the mkdocs-frontend cut.
# The crate stays in the workspace (cargo test still exercises it)
# but icelines-cli no longer consumes its markdown-generation API.
clap.workspace        = true
anyhow.workspace      = true
thiserror.workspace   = true
tokio.workspace       = true
comfy-table.workspace = true
csv.workspace         = true
owo-colors.workspace  = true
serde.workspace       = true
serde_json.workspace  = true
toml.workspace        = true
ratatui.workspace     = true
crossterm.workspace   = true
rusqlite.workspace    = true
reqwest.workspace     = true
flate2.workspace      = true
tar.workspace         = true
sha2.workspace        = true
image.workspace       = true
axum.workspace        = true
tower.workspace       = true
uuid.workspace        = true
chrono.workspace      = true
open.workspace        = true

# Post-LP review fix #4 — used only on Unix, only in main.rs to reset
# SIGPIPE to SIG_DFL so `| head` doesn't turn into a Rust panic. Tiny
# platform-shim crate; trivial to remove if we add a portable helper.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# proof_lib is parked as a dev-dep — the smoke test in
# `tests/proof_lib_smoke.rs` keeps the integration code paved in case
# we re-introduce proof for site dashboard generation later. The TUI
# panel renders sparklines natively (`tui::sparkline`) after we hit a
# dashboard-region directive composition bug
# (see design/proof-bug-report.md).
proof_lib = { package = "proof", git = "https://github.com/giodl73-repo/PROOF", rev = "9c5d456ef49cf8e1aeb516557d52ea0ddb79fd2c" }
tempfile.workspace = true
regex.workspace = true
