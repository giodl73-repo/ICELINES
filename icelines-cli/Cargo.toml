[package]
name    = "icelines-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "icelines"
path = "src/main.rs"

[dependencies]
icelines-core  = { path = "../icelines-core" }
icelines-fetch = { path = "../icelines-fetch" }
icelines-site  = { path = "../icelines-site" }
clap.workspace        = true
anyhow.workspace      = true
tokio.workspace       = true
comfy-table.workspace = true
owo-colors.workspace  = true
serde.workspace       = true
serde_json.workspace  = true
toml.workspace        = true
ratatui.workspace     = true
crossterm.workspace   = true
rusqlite.workspace    = true
reqwest.workspace     = true
flate2.workspace      = true
tar.workspace         = true
sha2.workspace        = true
# Phase 8j: proof_lib is now a runtime dep, gated behind the dashboards
# feature flag (off by default). The CLI binary always carries the code so
# turning the flag on at runtime needs no rebuild. Pinned by local path
# while proof's API is pre-1.0 — switch to git+rev pinning for releases.
# See design/proof_lib.md.
proof_lib = { package = "proof", path = "../../proof" }
# tempfile backs the proof_lib disk roundtrip (compile_file only takes
# paths). Promoted from dev-deps when proof_lib became a runtime dep.
tempfile.workspace = true
image.workspace       = true
axum.workspace        = true
tower.workspace       = true
uuid.workspace        = true
chrono.workspace      = true

[dev-dependencies]
# proof_lib + tempfile are now runtime deps above; tests reuse them
# without redeclaring.
