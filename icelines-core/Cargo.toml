[package]
name    = "icelines-core"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace        = true
serde.workspace            = true
serde_json.workspace       = true
regex.workspace            = true
sha2.workspace             = true
once_cell.workspace        = true
static_assertions.workspace = true
chrono.workspace           = true

[features]
# Default: StatsRepository is `!Send + !Sync` via PhantomData<*const ()> —
# a soft-lint preventing accidental cross-thread sharing in CLI / TUI
# code paths that don't wrap the repo in a synchronization primitive.
default = []

# Phase King Clancy King.1.2 — drop the !Send + !Sync marker so
# `icelines-web` can store StatsRepository in `Arc<RwLock<_>>` for
# axum's multi-threaded runtime. The marker is a lint, not a
# correctness mechanism: Rust's borrow checker still prevents
# concurrent mutation through `&` shared access. Enabling this
# feature is workspace-wide (cargo features are additive); CLI/TUI
# don't notice because they never try to share the repo.
send-sync = []

[dev-dependencies]
proptest = { workspace = true }
