[package]
name = "icelines-query"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# `send-sync` matches what icelines-web takes so PlayerView refs
# inside this crate cross the same Send/Sync boundary axum needs.
icelines-core = { path = "../icelines-core", features = ["send-sync"] }
thiserror.workspace = true
chrono.workspace = true

[dev-dependencies]
proptest.workspace = true
